name: Feature request
description: An idea that would make benchboss better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the situation in your league, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could benchboss help?
