name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting. Never paste your ESPN cookies (espn_s2, SWID) here."
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: benchboss optimize week
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste the output, including any `ESPN 4xx` line.
      render: text
  - type: textarea
    id: status
    attributes:
      label: benchboss status --offline
      render: text
  - type: input
    id: env
    attributes:
      label: OS and terminal
      placeholder: macOS 15, VS Code terminal
