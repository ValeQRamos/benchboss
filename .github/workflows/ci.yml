name: CI

# Tests are off while things change fast (the full matrix took 13 minutes). Lint and a CLI
# smoke test still run, and the Deploy workflow waits for this one to pass. To turn the tests
# back on, add the "Test" step below and the os and python matrix.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint and smoke test
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests tools
      - name: Smoke test the CLI
        run: benchboss --demo --json dash
